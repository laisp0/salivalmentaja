<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salivalmentaja</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Salivalmentaja">
<style>
  :root{--bg:#14161a;--card:#1e2127;--line:#2c3038;--txt:#e9eaec;--mut:#9097a3;--acc:#f2a33a;--ok:#4cc38a;--err:#ef5b5b}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px)}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  h1{font-size:20px;margin:0}
  h2{font-size:17px;margin:20px 0 8px}
  button{font:inherit;color:inherit;cursor:pointer}
  .ikoni{background:none;border:0;font-size:22px;padding:6px 8px;color:var(--mut)}
  .linkki{background:none;border:0;color:var(--acc);padding:6px 0;font-weight:600}
  .iso{display:block;width:100%;padding:28px 20px;margin:0 0 14px;border-radius:16px;border:1px solid var(--line);background:var(--card);text-align:left;font-size:20px;font-weight:650}
  .iso small{display:block;font-size:14px;font-weight:400;color:var(--mut);margin-top:4px}
  label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
  input,select{font:inherit;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%}
  input[type=checkbox]{width:24px;height:24px;accent-color:var(--acc)}
  .sarjat{width:100%;border-collapse:collapse;margin-top:8px}
  .sarjat th{font-size:13px;font-weight:500;color:var(--mut);text-align:left;padding:4px}
  .sarjat td{padding:4px;vertical-align:middle}
  .sarjat td:first-child{width:28px;color:var(--mut);text-align:center}
  .sarjat input[type=number]{padding:12px 8px;text-align:center}
  .poista{background:none;border:0;color:var(--mut);font-size:20px;padding:6px}
  .rivi{display:flex;gap:10px;margin-top:14px}
  .rivi button{flex:1;padding:16px;border-radius:12px;font-weight:650;border:1px solid var(--line);background:var(--card)}
  .rivi .paa{background:var(--acc);color:#1b1205;border-color:var(--acc)}
  .rivi button:disabled{opacity:.5}
  .tila{margin:12px 0 0;padding:10px 12px;border-radius:10px;font-size:15px}
  .tila.ok{background:#173528;color:var(--ok)}
  .tila.err{background:#3a1c1c;color:var(--err)}
  .tila.info{background:var(--card);color:var(--mut)}
  .kortti{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
  .kortti b{display:block;margin-bottom:2px}
  .mut{color:var(--mut);font-size:14px}
  .jono{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
  #dashboard h2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:24px 0 8px}
  #dashboard h2 .mut{font-weight:400;font-size:13px}
  #dashboard .kortti b{display:inline}
  #dashboard svg{display:block;max-width:100%;font-family:inherit}
  .paivitetty{margin:0 0 12px;text-align:right}
  .osio-ots{font-size:13px;color:var(--mut);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
  .kaksi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .rengas{display:flex;flex-direction:column;align-items:center;text-align:center;margin:0;padding:14px 8px;border-radius:18px}
  .rengas b{font-size:16px;margin-top:6px}
  .pieni{font-size:14px;color:#B9BEC7;line-height:1.45}
  .hyva{color:var(--ok)} .huono{color:var(--err)} .acc{color:var(--acc)}
  .valmentaja{background:var(--acc);color:#1b1205;border-radius:18px;padding:16px;margin-top:16px;font-size:15px;line-height:1.45}
  .valmentaja .yla{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
  .valmentaja .ots{font-size:20px;font-weight:800;margin:4px 0 6px;line-height:1.25}
  .luvut{display:flex;gap:22px;font-size:14px;margin-bottom:10px}
  .luvut span{display:block} .luvut b{font-size:22px}
  .chipit{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
  .chip{font-size:14px;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
  .chip.paalla{background:var(--acc);border-color:var(--acc);color:#1b1205;font-weight:600}
  .selite{margin:-4px 0 8px}
  .rivi-ots{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .rivi-ots b{font-size:17px}
  .pill{display:inline-block;background:#22262C;border-radius:8px;padding:6px 10px;font-size:14px;font-weight:600;margin-top:4px}
  .pill.nosta{background:#2A2215;color:var(--acc)}
  .suos{font-size:15px;line-height:1.4}
  .ryhmat{display:flex;flex-direction:column;gap:2px}
  .ryhma{display:grid;grid-template-columns:110px minmax(0,1fr) 52px;align-items:center;gap:8px;padding:10px 6px;border-radius:10px;border:0;background:transparent;text-align:left;font-size:14px}
  .ryhma.valittu{background:#2A2215}
  .ryhma .palkki{display:flex;align-items:center;gap:6px}
  .ryhma .palkki span{height:10px;border-radius:5px;display:block}
  .ryhma .palkki b{font-size:13px}
  .ryhma .mut{text-align:right;font-size:12px}
  .ehdotus{border-color:var(--acc);font-size:14px;line-height:1.6}
  .selitys{margin-top:24px;border-top:1px solid var(--line);padding-top:12px;font-size:14px;color:var(--mut)}
  .selitys summary{cursor:pointer;padding:6px 0}
  .selitys p{line-height:1.5}
  [hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <button id="takaisin" class="linkki" hidden>← Valikko</button>
  <h1 id="otsikko">💪 Salivalmentaja</h1>
  <button id="asetukset-nappi" class="ikoni" aria-label="Asetukset">⚙︎</button>
</header>

<!-- VALIKKO -->
<div id="jono-tila" class="tila info jono" hidden>
  <span id="jono-teksti"></span>
  <button id="jono-laheta" class="linkki">Lähetä nyt</button>
</div>

<section id="valikko">
  <button class="iso" data-nav="kirjaa">✍️ Kirjaa sarjoja<small>Syötä sarja tai useampi heti tekemisen jälkeen</small></button>
  <button class="iso" data-nav="dashboard">📈 Dashboard<small>Kehitys, tavoitteet ja suositukset</small></button>
  <p id="valikko-tila" class="mut"></p>
</section>

<!-- KIRJAUS -->
<section id="kirjaa" hidden>
  <label for="pvm">Päivä</label>
  <input id="pvm" type="date">

  <label for="liike">Liike</label>
  <select id="liike"></select>
  <div id="uusi-wrap" hidden>
    <label for="uusi">Uuden liikkeen nimi</label>
    <input id="uusi" type="text" autocomplete="off">
  </div>

  <label for="variaatio">Variaatio (valinnainen)</label>
  <input id="variaatio" type="text" placeholder="esim. vyö, jalat ylhäällä" autocomplete="off">

  <div id="viimeksi"></div>

  <table class="sarjat">
    <thead><tr><th>#</th><th>Toistot</th><th>Paino kg</th><th>Lämpö</th><th></th></tr></thead>
    <tbody id="rivit"></tbody>
  </table>

  <div class="rivi">
    <button id="lisaa">+ Sarja</button>
    <button id="tallenna" class="paa">Tallenna</button>
  </div>
  <p id="kirjaus-tila" class="tila" hidden></p>

  <h2 id="paiva-otsikko">Päivän sarjat</h2>
  <div id="paiva"></div>
</section>

<!-- DASHBOARD (siirretään seuraavassa vaiheessa) -->
<section id="dashboard" hidden></section>

<!-- ASETUKSET -->
<section id="asetukset" hidden>
  <p class="mut">Nämä tallentuvat vain tähän laitteeseen.</p>
  <label for="a-url">Apps Script -osoite (/exec)</label>
  <input id="a-url" type="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec">
  <label for="a-token">Avain (TOKEN)</label>
  <input id="a-token" type="password" autocomplete="off">
  <div class="rivi"><button id="a-tallenna" class="paa">Tallenna ja testaa</button></div>
  <p id="asetus-tila" class="tila" hidden></p>
</section>

<script src="dashboard.js?v=4"></script>
<script src="app.js?v=4"></script>
</body>
</html>
